dataset_version: nigeria-power-daily-2001-2024-v1
source:
  base_url: https://power.larc.nasa.gov/api/temporal/daily/point
  parameter_dictionary_url: https://power.larc.nasa.gov/parameters/
  community: AG
  format: JSON
  time_standard: UTC
period:
  start_year: 2001
  end_year: 2024
parameters:
  PRECTOTCORR:
    canonical_name: precipitation_corrected_mm_day
    expected_unit: mm/day
  T2M:
    canonical_name: temperature_mean_c
    expected_unit: C
  T2M_MIN:
    canonical_name: temperature_min_c
    expected_unit: C
  T2M_MAX:
    canonical_name: temperature_max_c
    expected_unit: C
quality:
  max_missing_fraction_warning: 0.02
  min_temperature_c: -20
  max_temperature_c: 60
  max_precipitation_mm_day: 1000
