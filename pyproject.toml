[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-pipeline-orchestration"
version = "0.1.0"
description = "Reproducible comparison of climate pipeline orchestration engines"
requires-python = ">=3.13,<3.14"
dependencies = [
  "duckdb==1.3.2", "fastapi==0.116.1", "httpx==0.28.1", "matplotlib==3.10.5",
  "pandas==2.3.1", "pandera==0.25.0", "pyarrow==21.0.0", "psutil==7.0.0",
  "PyYAML==6.0.2", "requests==2.32.4", "seaborn==0.13.2", "uvicorn==0.35.0"
]

[project.optional-dependencies]
test = ["ipykernel==6.30.1", "nbclient==0.10.2", "nbformat==5.10.4", "pytest==8.4.1"]
dev = ["ruff==0.12.9"]

[project.scripts]
climate-pipeline = "climate_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

